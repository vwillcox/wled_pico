; wled_pico
;
; See README.md for the full milestone plan. Milestone 2 adds WiFi AP +
; captive portal on top of milestone 1's display driver.
;
; Uses maxgerhardt's community PlatformIO platform, which wraps Earle
; Philhower's arduino-pico core (https://github.com/earlephilhower/arduino-pico).
;
; lib_deps below is the RP2040(+W) dependency combo documented directly by
; ESPAsyncWebServer's own install docs: RPAsyncTCP stands in for AsyncTCP
; (which is ESP-only) as the transport layer, same async API on top.
; https://esp32async.github.io/ESPAsyncWebServer/installation/

[env:cosmic_unicorn]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
; arduino-pico's OTA Updater writes the *new* firmware into this same
; LittleFS partition as a file before flashing it (see Updater.cpp's
; U_FLASH path) - it has to be bigger than the firmware image itself, not
; just big enough for presets.json. 1MB leaves ~1MB for the sketch, which
; is comfortably more than this firmware currently uses.
board_build.filesystem_size = 1024k
monitor_speed = 115200
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ayushsharma82/RPAsyncTCP@^1.3.2
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7
lib_ignore =
    lwIP_ESPHost
build_flags =
    -Wall
    -Wno-missing-field-initializers
